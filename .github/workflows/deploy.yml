name: Deploy Flutter Web to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - name: Verify .env exists
        run: |
          echo "Root .env:"
          cat .env
          echo "---"
          echo "pubspec assets section:"
          grep -A 5 "assets:" pubspec.yaml
      - name: Build
        run: flutter build web --release --base-href "/attendrr/"
      - name: Verify .env in build output
        run: |
          echo "Checking build output for .env:"
          find ./build/web -name "*.env" -o -name "assets*" | head -20
          ls -la ./build/web/assets/ || true
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
