name: attendr
description: "A comprehensive Flutter application for tracking university lecture attendance with gamification features."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.10.3
  flutter_dotenv: ^6.0.0
  icalendar_parser: ^2.0.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^17.0.0

  # Location
  geolocator: ^14.0.2
  location: ^8.0.1

  # Local Storage
  shared_preferences: ^2.3.3
  hive_flutter: ^1.1.0

  # UI/UX
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16

  # Utilities
  dio: ^5.7.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  intl: ^0.20.2

  # App Locking
  app_usage: ^4.0.1
  flutter_app_lock: ^4.3.0

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Charts for Statistics
  fl_chart: ^1.1.1

  # HTTP
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  json_serializable: ^6.11.2
  freezed: ^3.2.3
  flutter_lints: ^6.0.0
  mockito: ^5.6.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/onboarding/
    - assets/images/achievements/
    - assets/icons/
    - assets/fonts/
    -